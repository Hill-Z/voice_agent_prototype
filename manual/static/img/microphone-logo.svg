<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 话筒头部网格 -->
  <rect x="30" y="10" width="40" height="45" rx="5" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  
  <!-- 网格线 -->
  <line x1="35" y1="15" x2="35" y2="50" stroke="#60a5fa" stroke-width="1"/>
  <line x1="42" y1="15" x2="42" y2="50" stroke="#60a5fa" stroke-width="1"/>
  <line x1="49" y1="15" x2="49" y2="50" stroke="#60a5fa" stroke-width="1"/>
  <line x1="56" y1="15" x2="56" y2="50" stroke="#60a5fa" stroke-width="1"/>
  <line x1="63" y1="15" x2="63" y2="50" stroke="#60a5fa" stroke-width="1"/>
  
  <line x1="30" y1="22" x2="70" y2="22" stroke="#60a5fa" stroke-width="1"/>
  <line x1="30" y1="29" x2="70" y2="29" stroke="#60a5fa" stroke-width="1"/>
  <line x1="30" y1="36" x2="70" y2="36" stroke="#60a5fa" stroke-width="1"/>
  <line x1="30" y1="43" x2="70" y2="43" stroke="#60a5fa" stroke-width="1"/>
  
  <!-- 话筒颈部 -->
  <rect x="38" y="55" width="24" height="15" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  
  <!-- 话筒手柄 -->
  <rect x="42" y="70" width="16" height="25" rx="4" fill="#1e40af" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- 装饰线条 -->
  <line x1="44" y1="75" x2="56" y2="75" stroke="#60a5fa" stroke-width="1"/>
  <line x1="44" y1="82" x2="56" y2="82" stroke="#60a5fa" stroke-width="1"/>
  <line x1="44" y1="89" x2="56" y2="89" stroke="#60a5fa" stroke-width="1"/>
  
  <!-- 底部按钮 -->
  <circle cx="50" cy="95" r="4" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
</svg>